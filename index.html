<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>临时展示站</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; color: #17243d; background: radial-gradient(circle at 12% 15%, #dcecff 0, transparent 38%), radial-gradient(circle at 90% 80%, #e3e4ff 0, transparent 38%), #f7f9fd; }
    main { width: min(100%, 680px); padding: clamp(32px, 8vw, 68px); border: 1px solid #e4eaf3; border-radius: 26px; background: #fff; box-shadow: 0 24px 70px rgba(37, 64, 108, .1); }
    .mark { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 26px; color: #3369c6; font-size: 14px; font-weight: 700; letter-spacing: .07em; }
    .mark::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #4a82e2; box-shadow: 0 0 0 5px #e8f0ff; }
    h1 { margin: 0 0 18px; font-size: clamp(32px, 6vw, 48px); line-height: 1.18; letter-spacing: -.035em; }
    p { margin: 0; color: #56657a; font-size: clamp(16px, 2.7vw, 19px); line-height: 1.8; }
    .line { width: 48px; height: 4px; margin: 34px 0 24px; border-radius: 4px; background: #4a82e2; }
    .note { font-size: 14px; color: #8290a3; }
  </style>
</head>
<body>
  <main>
    <div class="mark">展示页面已就绪</div>
    <h1>临时展示站</h1>
    <p>这个页面已经可以在其他电脑上打开。展示内容稍后上传，请保存此链接，之后直接刷新即可查看更新。</p>
    <div class="line" aria-hidden="true"></div>
    <p class="note">当前为占位页面</p>
  </main>
</body>
</html>
